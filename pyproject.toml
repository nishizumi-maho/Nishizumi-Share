[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nishizumi-share"
version = "3.0.0"
description = "Secure, anonymous file sharing over Tor hidden services"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nishizumi-maho" }]
keywords = ["tor", "onion", "file-sharing", "privacy", "iracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Security",
]

dependencies = [
    "PyQt6>=6.5",
    "Flask>=3.0",
    "waitress>=2.1",
    "requests>=2.31",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]
build = ["pyinstaller>=6.3"]

[project.urls]
Homepage = "https://github.com/nishizumi-maho/Nishizumi-Share"
Issues = "https://github.com/nishizumi-maho/Nishizumi-Share/issues"

[project.gui-scripts]
nishizumi-share = "nishizumi_share.__main__:main"

[tool.setuptools]
packages = ["nishizumi_share", "nishizumi_share.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 120
filterwarnings = ["error::DeprecationWarning:nishizumi_share.*"]
